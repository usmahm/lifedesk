packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Single source of truth for every version in the monorepo.
# Packages reference these with "catalog:" — never a literal version.
# Do not bump anything here without asking. See docs/PLAN.md §6.1.
catalog:
  # --- framework ---
  next: 16.3.3
  react: 19.2.8
  react-dom: 19.2.8

  # --- rpc + data ---
  "@orpc/server": 1.15.0
  "@orpc/client": 1.15.0
  "@orpc/tanstack-query": 1.15.0
  "@tanstack/react-query": 5.102.8
  zod: 4.5.4

  # --- ui ---
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  tw-animate-css: 1.4.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.6.0
  lucide-react: 1.37.0
  next-themes: 0.4.6
  radix-ui: 1.6.7
  react-day-picker: 10.0.1
  sonner: 2.0.8
  react-hook-form: 7.87.0
  "@hookform/resolvers": 5.9.1

  # --- time ---
  date-fns: 4.4.0
  date-fns-tz: 3.2.0

  # --- tooling ---
  # TypeScript is pinned to 6.0.3, NOT 7.x. typescript-eslint has no release
  # supporting TS 7 — even its canary caps at "<6.1.0". Revisit when it ships.
  typescript: 6.0.3
  turbo: 2.10.12
  eslint: 10.9.1
  "@eslint/js": 10.0.1
  typescript-eslint: 8.68.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  "@next/eslint-plugin-next": 16.3.3
  eslint-plugin-turbo: 2.10.12
  globals: 17.11.0
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1
  vitest: 4.1.11
  "@types/node": 26.4.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
